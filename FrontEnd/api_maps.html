<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API - OpenStreetMap</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #search-container {
            padding: 15px;
            background-color: #f8f9fa;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        #search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        #search-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        #search-btn:hover {
            background-color: #0056b3;
        }

        #search-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        .loading {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Ingresa una dirección" />
        <button id="search-btn">Buscar</button>
    </div>

    <div id="loading" class="loading">Buscando ubicación...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script>
        const map = L.map('map').setView([-29.9027, -71.2520], 13);

        // Cargar capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentMarker = null;

        // Función para buscar dirección
        async function searchAddress() {
            const query = document.getElementById('search-input').value.trim();
            const loading = document.getElementById('loading');
            const btn = document.getElementById('search-btn');

            if (!query) {
                alert('Por favor ingresa una dirección');
                return;
            }
            loading.style.display = 'block';
            btn.disabled = true;

            try {
                // Llamada a la API de Nominatim
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Error en la respuesta de la API');
                }

                const data = await response.json();

                if (data.length === 0) {
                    alert('No se encontró ninguna ubicación para esa dirección.');
                    return;
                }

                const result = data[0];
                const lat = parseFloat(result.lat);
                const lon = parseFloat(result.lon);

                // Mover el mapa a la ubicación encontrada
                map.setView([lat, lon], 16);

                // Eliminar marcador anterior si existe
                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }

                // Agregar nuevo marcador
                currentMarker = L.marker([lat, lon]).addTo(map)
                    .bindPopup(`<b>Resultado:</b><br>${result.display_name}`)
                    .openPopup();

            } catch (error) {
                console.error('Error al buscar:', error);
                alert('Ocurrió un error al buscar la dirección. Intente nuevamente.');
            } finally {
                // Ocultar estado de carga
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        // Event Listeners
        document.getElementById('search-btn').addEventListener('click', searchAddress);

        // Permitir buscar presionando Enter
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchAddress();
            }
        });
    </script>
</body>
</html>
